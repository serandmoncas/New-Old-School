  curioso:
    - nombre: Gancho
      objetivo: 30
      texto:
        - ¿Cómo estudiaron para su último examen? Si la respuesta es “leí el cuaderno otra vez y subrayé lo importante”, están en buena compañía, porque es lo que más hace la gente.
        - Y, según la investigación, es de lo que menos funciona.
    - nombre: Idea
      objetivo: 90
      texto:
        - Cuando releemos, el texto se vuelve familiar, y esa familiaridad se siente como saber. Pero reconocer algo no es poder recordarlo.
        - En cambio, cerrar el cuaderno e intentar recordar cuesta. Uno se equivoca, se queda en blanco, siente que no avanza. Ese esfuerzo es justamente lo que hace que lo aprendido dure. Los psicólogos lo llaman dificultades deseables.
        - Lo mismo pasa con repartir el estudio en varios días en vez de meter todo la noche anterior. Se siente peor, y funciona mejor. Lo que se siente como aprender no siempre es aprender.
    - nombre: Evidencia
      objetivo: 60
      texto:
        - 'En 2013, un grupo de psicólogos revisó diez técnicas de estudio. Solo dos recibieron utilidad alta: ponerse a prueba y repartir el estudio en el tiempo. Releer y subrayar recibieron utilidad baja.'
        - Y una idea muy popular, enseñar según el “estilo de aprendizaje” de cada uno, visual o auditivo, no tiene evidencia de que mejore lo que se aprende.
    - nombre: ¿Y a mí qué?
      objetivo: 60
      texto:
        - Si estudias, cierra el cuaderno y escribe lo que recuerdas; reparte el estudio en varios días; mezcla tipos de ejercicios.
        - Si enseñas, empieza la clase con tres preguntas cortas sobre la anterior, sin nota.
        - Si acompañas en casa, en vez de “¿estudiaste?”, pregunta “¿qué aprendiste? Explícamelo sin mirar”.
    - nombre: Puerta abierta
      objetivo: 30
      texto:
        - Dos libros para seguir. Apréndetelo (Make It Stick), escrito por los propios investigadores, y Aprender a aprender, pensado para estudiantes.
        - Y la pregunta para conversar, ¿qué vas a dejar de hacer la próxima vez que estudies?
  escenas:
    tecnicas:
      nombre: Diez técnicas de estudio
      fuente: Dunlosky, Rawson, Marsh, Nathan y Willingham (2013), Psychological Science in the Public Interest. doi.org/10.1177/1529100612453266
      titulo: Utilidad de diez técnicas de estudio, según una revisión de 2013
      utilidad: Utilidad
      niveles: [alta, moderada, baja]
