  curioso:
    - nombre: Hook
      objetivo: 30
      texto:
        - How did you study for your last exam? If the answer is “I reread my notes and highlighted the important parts”, you are in good company, because that is what most people do.
        - And, according to research, it is one of the things that works least.
    - nombre: Idea
      objetivo: 90
      texto:
        - When we reread, the text becomes familiar, and that familiarity feels like knowing. But recognizing something is not the same as being able to recall it.
        - Closing the notebook and trying to recall, on the other hand, is hard. You make mistakes, you go blank, you feel you are not getting anywhere. That effort is exactly what makes learning last. Psychologists call it desirable difficulties.
        - The same happens with spreading study over several days instead of cramming the night before. It feels worse, and it works better. What feels like learning is not always learning.
    - nombre: Evidence
      objetivo: 60
      texto:
        - 'In 2013, a group of psychologists reviewed ten study techniques. Only two were rated high utility: practice testing and spreading study over time. Rereading and highlighting were rated low utility.'
        - And a very popular idea, teaching each student according to their “learning style”, visual or auditory, has no evidence that it improves what is learned.
    - nombre: So what?
      objetivo: 60
      texto:
        - If you study, close the notebook and write what you remember; spread study over several days; mix kinds of exercises.
        - If you teach, start class with three short, ungraded questions about the previous one.
        - If you support a student at home, instead of “did you study?”, ask “what did you learn? Explain it to me without looking”.
    - nombre: Open door
      objetivo: 30
      texto:
        - Two books to keep going. Make It Stick, written by the researchers themselves, and Learning How to Learn, written for students.
        - And the question to discuss, what will you stop doing the next time you study?
  escenas:
    tecnicas:
      nombre: Ten study techniques
      fuente: Dunlosky, Rawson, Marsh, Nathan and Willingham (2013), Psychological Science in the Public Interest. doi.org/10.1177/1529100612453266
      titulo: Utility of ten study techniques, according to a 2013 review
      utilidad: Utility
      niveles: [high, moderate, low]
      tecnicas:
        - [Practice testing (recall without looking), Spreading study over time]
        - [Asking yourself why, Explaining to yourself, Mixing kinds of exercises]
        - [Summarizing, Highlighting, Keyword mnemonic, Imagery for text, Rereading]
      cierre: What people do most, rereading and highlighting, is at the bottom.
    practica:
      nombre: How much practice explains
      fuente: Macnamara, Hambrick and Oswald (2014), Psychological Science. doi.org/10.1177/0956797614535810
      titulo: Share of performance differences explained by practice
      etiquetas: [Games (chess and others), Music, Sports, Education, Professions]
      menos_de: 'less than '
      cierre: Practice matters, but in school and work it explains very little of the differences.
