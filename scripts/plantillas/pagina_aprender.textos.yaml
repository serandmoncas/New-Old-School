        - [Preguntarse por qué, Explicarse a uno mismo, Mezclar tipos de ejercicios]
        - [Resumir, Subrayar, Palabras clave (mnemotecnia), Imaginar el texto, Releer]
      cierre: Lo que más hace la gente, releer y subrayar, está abajo.
    practica:
      nombre: Cuánto explica la práctica
      fuente: Macnamara, Hambrick y Oswald (2014), Psychological Science. doi.org/10.1177/0956797614535810
      titulo: Porcentaje de las diferencias de desempeño que explica la práctica
      etiquetas: [Juegos (ajedrez y otros), Música, Deportes, Educación, Profesiones]
      menos_de: 'menos de '
      cierre: La práctica importa, pero en el estudio y el trabajo explica muy poco de las diferencias.

