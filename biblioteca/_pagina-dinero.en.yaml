grupos:
  - nombre: Stories that teach about money
    sub: Fables, poems, plays and novels that tell an idea from the module better than an explanation
  - nombre: The history of money and markets
    sub: Where accounting, trade and bubbles come from
  - nombre: How we decide with money
    sub: Predictable mistakes, and how to design better decisions
  - nombre: Saving, starting a business and living well
    sub: From the budget to your own business, and how much money matters in a good life
  - nombre: The most read, read closely
    sub: Very popular money books, to separate what holds up from what does not

rutas:
  - nombre: If you are a student
    texto: Short stories, two practical books to start managing your money and one to read closely.
  - nombre: If you teach
    texto: Why we decide badly with money, and how to use it in class.
  - nombre: If you support a student at home
    texto: Saving without heroics, distrusting easy promises and not confusing money with happiness.

