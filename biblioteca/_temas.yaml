# Vocabulario de temas de la biblioteca. Un libro solo puede usar temas de esta lista.
# Para agregar uno, súmalo aquí en el mismo PR, con una descripción de una línea.
ahorro: guardar hoy para mañana
autocontrol: resistir una tentación con un plan
codicia: querer más de lo que hace falta, y lo que eso cuesta
comercio: comprar, vender e intercambiar
deuda: deber dinero y lo que pasa si no se paga
dignidad: sostenerse cuando falta todo
emprendimiento: arriesgar para crear algo propio
especulacion: comprar porque otros compran (burbujas y pirámides)
identidad: quién soy y de cuántas piezas estoy hecho
justicia: qué es justo cuando alguien no puede cumplir
matematicas: cuentas que cambiaron la historia
necesidad-y-deseo: lo que necesito frente a lo que quiero
presupuesto: lo que entra frente a lo que sale
sesgos: errores de pensamiento que todos cometemos sin darnos cuenta
soledad: estar solo, por elección o por fuerza
viaje: salir de casa y volver distinto
vejez-y-proteccion: de qué vivir cuando ya no se puede trabajar
