name: Validar currículo

on:
  # Corre en todo PR (sin filtro de rutas): main exige este chequeo, y un
  # chequeo obligatorio que no corre deja el PR bloqueado.
  pull_request:
  push:
    branches: [main]

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Validar encabezados, grafo y estados
        run: python scripts/validar_curriculo.py
      - name: Validar la biblioteca y su índice
        run: python scripts/biblioteca.py --comprobar
      - name: Generar las páginas de la biblioteca (sin publicarlas)
        # Una ficha puede cambiar otra página (un cruce nuevo pide su traducción al inglés).
        run: |
          mkdir -p "$RUNNER_TEMP/paginas"
          python scripts/pagina_aprender.py --publicar "$RUNNER_TEMP/paginas"
      - name: Un nodo por PR (los PR de grafo pueden traer encabezados de nodos)
        if: github.event_name == 'pull_request'
        run: |
          cambios=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- 'curriculo/*/nucleo/*.md' 'curriculo/*/locales/*/*.md')
          grafo=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- 'curriculo/*/_modulo.yaml')
          n=$(echo "$cambios" | grep -c . || true)
          echo "Nodos modificados: $n"
          if [ -n "$grafo" ]; then
            echo "PR de grafo: se permiten nodos nuevos y ajustes de encabezado; el curador revisa que no traiga contenido."
            exit 0
          fi
          if [ "$n" -gt 1 ] && ! echo "${{ join(github.event.pull_request.labels.*.name, ',') }}" | grep -q "varios-nodos"; then
            echo "::error::Este PR toca $n nodos. Divide el PR o pide a un curador la etiqueta 'varios-nodos'."
            exit 1
          fi
