name: Publicar sitio

# Construye el sitio desde curriculo/ y lo publica en GitHub Pages
# cada vez que cambia main. Requiere: Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - "curriculo/**"
      - "scripts/**"
      - "sitio/**"
      - ".github/workflows/sitio.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/construir_sitio.py --salida _sitio
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
